/**:
  ros__parameters:
    # Minimal ZED Configuration for IMU-only operation (ZED 5.1.0)
    # All camera streams and expensive features disabled for lightweight IMU data collection

    # General settings - minimal processing
    general:
      pub_resolution: 'CUSTOM'
      pub_downscale_factor: 4.0
      pub_frame_rate: 1.0

    # Video settings - DISABLE all image publishing
    video:
      publish_rgb: false
      publish_left_right: false
      publish_raw: false
      publish_gray: false
      publish_stereo: false

    # Depth settings - DISABLE depth computation
    depth:
      depth_mode: 'NONE'
      depth_stabilization: 0
      point_cloud_freq: 0.0
      publish_depth_map: false
      publish_depth_info: false
      publish_point_cloud: false
      publish_depth_confidence: false
      publish_disparity: false

    # Positional tracking - DISABLE
    pos_tracking:
      pos_tracking_enabled: false
      publish_tf: false
      publish_map_tf: false

    # Mapping - DISABLE
    mapping:
      mapping_enabled: false

    # Object Detection - DISABLE
    object_detection:
      od_enabled: false

    # Body Tracking - DISABLE
    body_tracking:
      bt_enabled: false

    # Sensors - ENABLE IMU only
    sensors:
      sensors_image_sync: false
      sensors_pub_rate: 100.0
      publish_imu: true
      publish_imu_tf: true
      publish_imu_raw: false
      publish_mag: false
      publish_baro: false
      publish_temp: false

    # Advanced settings - low priority
    advanced:
      thread_sched_policy: 'SCHED_BATCH'

    # Debug - disable all
    debug:
      sdk_verbose: 0
      debug_common: false
      debug_video_depth: false
      debug_sensors: false
