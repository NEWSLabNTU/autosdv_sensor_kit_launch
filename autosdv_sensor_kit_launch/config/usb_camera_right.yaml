/**:
  ros__parameters:
    # Camera device configuration
    video_device: "/dev/video3"
    camera_name: "usb_camera_right"
    camera_info_url: ""
    frame_id: "usb_camera_right_optical_link"

    # Image settings
    image_width: 1920
    image_height: 1080
    framerate: 30.0

    # GStreamer pipeline for hardware acceleration on Jetson
    gscam_config: "v4l2src device=/dev/video3 ! image/jpeg,width=1920,height=1080,framerate=30/1 ! nvv4l2decoder mjpeg=1 ! nvvidconv ! video/x-raw,format=BGRx ! videoconvert ! video/x-raw,format=BGR"

    # Camera control parameters
    auto_exposure: true
    auto_white_balance: true
    brightness: 128
    contrast: 128
    saturation: 128

    # Image processing
    image_encoding: "bgr8"
    sync_sink: true
    preroll: false
    use_gst_timestamps: true

    # Performance settings
    reopen_on_eof: false
    camera_info_rescale: true
